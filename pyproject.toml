[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cerin-1112-codexbench"
version = "0.4.0"
description = "Week 4 harness-condition experiment planner and SWE-bench evaluator"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codexbench = "codexbench.cli:main"

[tool.setuptools]
packages = ["codexbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
